
name: digital-notes-app

services:

  digital-notes:
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Data__ConnectionString=Host=host.docker.internal:5432;Database=postgres;Username=postgres;Password=user
    depends_on:
      - postgres
    ports:
      - "8080:8080"
      - "8081:8081"

  postgres:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user
      
  adminer:
    image: adminer
    restart: always
    ports:
      - 80:8080

